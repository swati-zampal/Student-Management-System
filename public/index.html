<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management System</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark">SP</span>
            <span>
                <b>Student Portal</b>
                <small>Management Suite</small>
            </span>
        </div>

        <nav id="nav">
            <button class="nav-item active" data-view="dashboard">▦ <span>Dashboard</span></button>
            <button class="nav-item" data-view="students">♙ <span>Students</span></button>
            <button class="nav-item" data-view="courses">▤ <span>Courses</span></button>
            <button class="nav-item" data-view="batches">▣ <span>Batches</span></button>
            <button class="nav-item" data-view="attendance">✓ <span>Attendance</span></button>
            <button class="nav-item" data-view="fees">₹ <span>Fees</span></button>
            <button class="nav-item" data-view="results">★ <span>Results</span></button>
            <button class="nav-item" data-view="reports">▥ <span>Reports</span></button>
        </nav>

        <div class="sidebar-bottom">
            <div id="userBadge" class="user-badge"></div>
            <button id="logoutBtn" class="nav-item">↪ <span>Sign out</span></button>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <p class="eyebrow">ADMINISTRATION</p>
                <h1 id="pageTitle">Dashboard</h1>
            </div>
            <div class="top-actions">
                <span class="status-dot"></span>
                <span id="today"></span>
            </div>
        </header>

        <div id="notice" role="status" class="notice hidden"></div>
        <section id="view"></section>

        <footer>Student Portal <span>•</span> LEMP deployment project</footer>
    </main>
</div>

<script src="/assets/app.js" defer></script>
</body>
</html>
